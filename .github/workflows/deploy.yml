name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other; always ship the newest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot engine + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            godot-engine
            export-templates
          key: godot-4.6.1-stable

      - name: Download Godot 4.6.1 (linux editor)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot-engine
          mv Godot_v4.6.1-stable_linux.x86_64 godot-engine/godot

      - name: Download export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          mkdir -p export-templates
          unzip -q templates.tpz -d export-templates

      - name: Install engine + templates
        run: |
          sudo install -m 755 godot-engine/godot /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          mv export-templates/templates ~/.local/share/godot/export_templates/4.6.1.stable

      # Import assets so the GUT run and export start from a warm .godot/
      - name: Import project
        run: godot --headless --path godot --import

      # A red test gate never reaches Pages.
      - name: GUT test gate
        run: godot --headless --path godot -s addons/gut/gut_cmdln.gd

      - name: Export web build
        run: |
          mkdir -p dist-godot
          godot --headless --path godot --export-release "Web" "../dist-godot/index.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-godot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
