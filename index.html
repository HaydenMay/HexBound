<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="HexBound - a witchcraft tower defense game" />
    <title>HexBound</title>
    <style>
      :root {
        --bg: #0d0a16;
        --panel: rgba(21, 14, 36, 0.86);
        --panel-edge: rgba(178, 107, 255, 0.28);
        --accent: #b26bff;
        --essence: #8cff9d;
        --danger: #ff5a5a;
        --teal: #6fd8c8;
        --text: #e8e0f0;
        --muted: #9d92b4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        user-select: none;
      }
      #topbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px 18px;
        padding: 10px 16px;
        background: linear-gradient(to bottom, rgba(13, 10, 22, 0.9), rgba(13, 10, 22, 0));
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      #essence-value {
        color: var(--essence);
      }
      #ritual {
        flex: 1;
        max-width: 380px;
        height: 26px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        position: relative;
        overflow: hidden;
      }
      #ritual-fill {
        position: absolute;
        inset: 0;
        width: 0%;
        background: linear-gradient(90deg, #5a2a8a, #b26bff);
        transition: width 0.3s ease;
      }
      #ritual-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      #stability {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .pip {
        width: 11px;
        height: 11px;
        transform: rotate(45deg);
        background: var(--danger);
        box-shadow: 0 0 6px rgba(255, 90, 90, 0.7);
        transition: opacity 0.25s;
      }
      .pip.out {
        opacity: 0.15;
        box-shadow: none;
      }
      #sysbtns {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      button {
        pointer-events: auto;
        font-family: inherit;
        cursor: pointer;
      }
      .sysbtn,
      #startwave {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        transition: border-color 0.15s, transform 0.05s;
      }
      .sysbtn:hover:not(:disabled),
      #startwave:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .sysbtn:active:not(:disabled),
      #startwave:active:not(:disabled) {
        transform: scale(0.96);
      }
      .sysbtn {
        min-width: 74px;
        padding: 7px 10px;
        font-size: 13px;
      }
      .sysbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #bottombar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
      }
      #wavepreview {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: 96vw;
        pointer-events: none;
      }
      #palette {
        display: flex;
        gap: 10px;
        max-width: min(96vw, 980px);
        overflow-x: auto;
        touch-action: pan-x;
        -webkit-overflow-scrolling: touch;
        padding: 6px 4px;
        border-radius: 12px;
        scrollbar-width: thin;
      }
      .card {
        width: 168px;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 10px 12px;
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: border-color 0.15s, transform 0.1s, opacity 0.2s;
        touch-action: pan-x;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card.selected {
        border-color: var(--teal);
        box-shadow: 0 0 14px rgba(111, 216, 200, 0.35);
        transform: translateY(-4px);
      }
      .card.poor {
        opacity: 0.45;
      }
      .card-key {
        position: absolute;
        display: none;
      }
      .card-name {
        font-weight: 700;
        font-size: 14px;
      }
      .card-cost {
        font-size: 12px;
        color: var(--essence);
        font-weight: 600;
      }
      .card-blurb {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.35;
      }
      #startwave {
        font-size: 15px;
        padding: 14px 26px;
        color: #14101f;
        background: var(--accent);
        border-color: transparent;
      }
      #startwave.hidden {
        display: none;
      }
      .chip {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .chip i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .trait-label {
        position: absolute;
        top: 0;
        left: 0;
        color: #ffe08a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
      }
      #inspect {
        position: fixed;
        right: 16px;
        top: 72px;
        width: 240px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 14px;
        padding: 14px;
        pointer-events: auto;
        backdrop-filter: blur(4px);
      }
      #inspect.hidden {
        display: none;
      }
      #inspect-title {
        font-size: 15px;
        font-weight: 800;
        margin: 0 0 8px;
        padding-right: 20px;
      }
      #inspect-close {
        position: absolute;
        top: 8px;
        right: 10px;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .inspect-tier {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
        margin-bottom: 10px;
      }
      .inspect-hp {
        font-size: 12px;
        margin-bottom: 10px;
        color: var(--text);
      }
      .inspect-hp span {
        color: var(--essence);
        font-weight: 700;
      }
      .upgrade-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .upgrade-btn {
        text-align: left;
        background: rgba(178, 107, 255, 0.1);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        padding: 9px 11px;
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: border-color 0.15s, opacity 0.2s;
      }
      .upgrade-btn:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .upgrade-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .up-label {
        font-weight: 700;
        font-size: 13px;
      }
      .up-desc {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.35;
      }
      .up-cost {
        font-size: 11px;
        color: var(--essence);
        font-weight: 600;
      }
      .upgrade-max {
        font-size: 12px;
        color: var(--teal);
        font-style: italic;
      }
      #banner {
        position: fixed;
        top: 18%;
        left: 50%;
        transform: translateX(-50%) scale(0.92);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 12px 30px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.12em;
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        white-space: nowrap;
      }
      #banner.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      #banner.danger {
        color: var(--danger);
        border-color: rgba(255, 90, 90, 0.55);
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 120px rgba(255, 40, 40, 0);
        transition: box-shadow 0.12s;
      }
      #vignette.hit {
        box-shadow: inset 0 0 160px rgba(255, 40, 40, 0.65);
      }
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 7, 18, 0.82);
        backdrop-filter: blur(6px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: auto;
        z-index: 10;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay-title {
        font-size: 42px;
        margin: 0;
        letter-spacing: 0.06em;
      }
      #overlay-sub {
        color: var(--muted);
        max-width: 420px;
        text-align: center;
        line-height: 1.5;
        margin: 0 0 14px;
      }
      #restart {
        background: var(--accent);
        color: #14101f;
        border: none;
        border-radius: 10px;
        padding: 12px 32px;
        font-size: 16px;
        font-weight: 800;
      }
      #menu {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1c1430 0%, #0d0a16 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 20;
        padding: 20px;
      }
      #menu.hidden {
        display: none;
      }
      #menu h1 {
        font-size: 52px;
        letter-spacing: 0.14em;
        margin: 0;
        color: var(--accent);
        text-shadow: 0 0 30px rgba(178, 107, 255, 0.5);
      }
      #menu .menu-sub {
        color: var(--muted);
        margin-top: -14px;
        font-size: 14px;
      }
      #level-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(420px, 92vw);
      }
      .level-btn {
        display: grid;
        grid-template-columns: 44px 1fr;
        grid-template-rows: auto auto;
        column-gap: 12px;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 12px 16px;
        color: var(--text);
        transition: border-color 0.15s, transform 0.08s;
      }
      .level-btn:hover:not(:disabled) {
        border-color: var(--accent);
        transform: translateX(3px);
      }
      .level-btn.locked {
        opacity: 0.4;
        cursor: default;
      }
      .lv-num {
        grid-row: span 2;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: rgba(178, 107, 255, 0.14);
        color: var(--accent);
        font-weight: 800;
        font-size: 18px;
      }
      .lv-name {
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      .lv-blurb {
        font-size: 12px;
        color: var(--muted);
      }
      #reset-save {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
        pointer-events: auto;
      }
      #field-size {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #size-picker {
        display: flex;
        gap: 6px;
      }
      .size-btn {
        background: var(--panel);
        color: var(--muted);
        border: 1px solid var(--panel-edge);
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      }
      .size-btn:hover:not(.selected) {
        border-color: var(--accent);
        color: var(--text);
      }
      .size-btn.selected {
        background: rgba(178, 107, 255, 0.16);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 0 12px rgba(178, 107, 255, 0.35);
        cursor: default;
      }
      @media (max-width: 720px) {
        .card {
          width: 116px;
          padding: 8px 9px;
          flex-shrink: 0;
        }
        .card-name {
          font-size: 12px;
        }
        .card-cost {
          font-size: 11px;
        }
        .card-blurb {
          display: none;
        }
        .stat {
          padding: 4px 10px;
          font-size: 13px;
        }
        #topbar {
          gap: 8px;
          padding: 8px 10px;
        }
        #ritual {
          height: 22px;
        }
        .pip {
          width: 9px;
          height: 9px;
        }
        .sysbtn {
          min-width: 54px;
          padding: 5px 8px;
          font-size: 11px;
        }
        #startwave {
          font-size: 14px;
          padding: 12px 22px;
        }
        #inspect {
          left: 12px;
          right: 12px;
          width: auto;
          top: auto;
          bottom: 205px;
          max-height: 38vh;
          overflow-y: auto;
        }
        #banner {
          font-size: 15px;
          top: 13%;
        }
        #overlay-title {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="topbar">
        <div class="stat"><span id="essence-value">0</span> essence</div>
        <div class="stat" id="wave-value">Wave 1 / 8</div>
        <div id="ritual">
          <div id="ritual-fill"></div>
          <span id="ritual-label">Ritual 0%</span>
        </div>
        <div id="stability"></div>
        <div id="sysbtns">
          <button class="sysbtn" id="pause">Pause</button>
          <button class="sysbtn" id="speed">1x</button>
        </div>
      </div>
      <div id="banner"></div>
      <div id="bottombar">
        <div id="wavepreview"></div>
        <div id="palette"></div>
        <button id="startwave">Begin Wave 1</button>
      </div>
    </div>
    <div id="labels"></div>
    <div id="menu">
      <h1>HEXBOUND</h1>
      <p class="menu-sub">They march to end your ritual. You decide the road they take.</p>
      <div id="level-list"></div>
      <div id="field-size">
        <span class="menu-sub">battleground</span>
        <div id="size-picker">
          <button class="size-btn" data-size="small">Small</button>
          <button class="size-btn selected" data-size="medium">Medium</button>
          <button class="size-btn" data-size="large">Large</button>
        </div>
      </div>
      <button id="reset-save">reset progress</button>
    </div>
    <div id="inspect" class="hidden">
      <button id="inspect-close">&times;</button>
      <h3 id="inspect-title"></h3>
      <div id="inspect-body"></div>
    </div>
    <div id="vignette"></div>
    <div id="overlay" class="hidden">
      <h1 id="overlay-title"></h1>
      <p id="overlay-sub"></p>
      <button id="restart">Try Again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
